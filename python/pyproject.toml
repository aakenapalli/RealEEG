[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eegpipe"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["numpy>=2.0,<3", "pyedflib>=0.1.38,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["eegpipe"]
